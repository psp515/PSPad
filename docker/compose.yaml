name: pspad

services:
  api:
    build:
      context: ..
      dockerfile: src/PSPad.Api/Dockerfile
    image: pspad-api:local
    environment:
      Mongo__ConnectionString: mongodb://pspad:${MONGO_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin&directConnection=true
      Mongo__Database: ${MONGO_DATABASE}
      Keycloak__Authority: ${KEYCLOAK_INTERNAL_AUTHORITY}
      Keycloak__Audience: ${KEYCLOAK_AUDIENCE}
      Keycloak__RequireHttpsMetadata: "false"
      Keycloak__AdminUser: ${KEYCLOAK_ADMIN_USER}
      Keycloak__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${APP_BASE_ADDRESS}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${API_BEHIND_PROXY:-false}
    ports:
      - "5000:8080"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [pspad, psplace]

  app:
    build:
      context: ..
      dockerfile: src/PSPad.App/Dockerfile
    image: pspad-app:local
    environment:
      API_BASE_ADDRESS: ${API_BASE_ADDRESS}
      APP_BASE_ADDRESS: ${APP_BASE_ADDRESS}
      KEYCLOAK_AUTHORITY: ${KEYCLOAK_AUTHORITY}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    ports:
      - "5001:8080"
    depends_on:
      - api
    networks: [pspad]

  mongo:
    image: mongo:8
    entrypoint: ["bash", "/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pspad
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/keyfile
      - ./mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u pspad -p ${MONGO_PASSWORD} --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks: [pspad]

  mongo-backup:
    build:
      context: ..
      dockerfile: src/PSPad.Backup/Dockerfile
      target: mongo
    image: pspad-backup-mongo:local
    profiles: [backup]
    environment:
      BACKUP_STACK: mongo
      BACKUP_MONGO_URI: ${BACKUP_MONGO_URI:-mongodb://pspad:${MONGO_PASSWORD}@mongo:27017/?authSource=admin&directConnection=true}
      BACKUP_MONGO_DATABASE: ${MONGO_DATABASE}
      BACKUP_SERVICE_PROBE: api:8080
      BACKUP_AT: ${BACKUP_AT:-03:17}
      BACKUP_TZ: ${BACKUP_TZ:-UTC}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_GDRIVE_REFRESH_TOKEN: ${BACKUP_GDRIVE_REFRESH_TOKEN:-}
      BACKUP_GDRIVE_FOLDER: ${BACKUP_GDRIVE_FOLDER:-pspad-backups}
      BACKUP_GDRIVE_CLIENT_ID: ${BACKUP_GDRIVE_CLIENT_ID:-}
      BACKUP_GDRIVE_CLIENT_SECRET: ${BACKUP_GDRIVE_CLIENT_SECRET:-}
      BACKUP_REMOTE_PRUNE: ${BACKUP_REMOTE_PRUNE:-true}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - ${BACKUP_LOCAL_DIR:-mongo-backups}:/backups
      - ${BACKUP_AGE_IDENTITY_FILE:-/dev/null}:/run/secrets/age-identity:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [pspad]

volumes:
  mongo-data:
  mongo-keyfile:
  mongo-backups:

networks:
  pspad:
  psplace:
    external: true
