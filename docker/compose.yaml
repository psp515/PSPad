name: pspad

services:
  mongo:
    image: mongo:8
    entrypoint: ["bash", "/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pspad
      MONGO_INITDB_ROOT_PASSWORD: pspad
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
      - ./mongo-keyfile:/keyfile-source/mongo-keyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u pspad -p pspad --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks: [pspad]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks: [pspad]

volumes:
  mongo-data:

networks:
  pspad:
