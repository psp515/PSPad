name: keycloak

services:
  keycloak-db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in docker/keycloak/.env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [keycloak]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      APP_BASE_ADDRESS: ${APP_BASE_ADDRESS}
      API_BASE_ADDRESS: ${API_BASE_ADDRESS}
    ports:
      - "8080:8080"
    volumes:
      - ./import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [keycloak, psplace]

  keycloak-backup:
    build:
      context: ../backup
      target: keycloak
    image: keycloak-backup:local
    profiles: [backup]
    environment:
      BACKUP_STACK: keycloak
      BACKUP_PG_URI: ${BACKUP_PG_URI:-postgresql://keycloak:${KEYCLOAK_DB_PASSWORD}@keycloak-db:5432/keycloak}
      BACKUP_SERVICE_PROBE: keycloak:8080
      BACKUP_AT: ${BACKUP_AT:-03:47}
      BACKUP_TZ: ${BACKUP_TZ:-UTC}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_GDRIVE_TOKEN: ${BACKUP_GDRIVE_TOKEN:-}
      BACKUP_GDRIVE_FOLDER_ID: ${BACKUP_GDRIVE_FOLDER_ID:-}
      BACKUP_GDRIVE_CLIENT_ID: ${BACKUP_GDRIVE_CLIENT_ID:-}
      BACKUP_GDRIVE_CLIENT_SECRET: ${BACKUP_GDRIVE_CLIENT_SECRET:-}
      BACKUP_REMOTE_PRUNE: ${BACKUP_REMOTE_PRUNE:-true}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - ${BACKUP_LOCAL_DIR:-keycloak-backups}:/backups
      - ${BACKUP_AGE_IDENTITY_FILE:-/dev/null}:/run/secrets/age-identity:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [keycloak]

volumes:
  keycloak-db-data:
  keycloak-backups:

networks:
  keycloak:
  psplace:
    name: psplace
