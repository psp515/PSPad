name: pspad-prod

services:
  api:
    build:
      context: ..
      dockerfile: src/PSPad.Api/Dockerfile
    image: pspad-api:local
    environment:
      Mongo__ConnectionString: ${MONGO_CONNECTION}
      Mongo__Database: ${MONGO_DATABASE}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
      Keycloak__Audience: ${KEYCLOAK_AUDIENCE}
      Cors__AllowedOrigins__0: ${APP_BASE_ADDRESS}
    ports:
      - "5000:8080"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [pspad]

  app:
    build:
      context: ..
      dockerfile: src/PSPad.App/Dockerfile
    image: pspad-app:local
    environment:
      API_BASE_ADDRESS: ${API_BASE_ADDRESS}
      APP_BASE_ADDRESS: ${APP_BASE_ADDRESS}
      KEYCLOAK_AUTHORITY: ${KEYCLOAK_AUTHORITY}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    ports:
      - "5001:8080"
    depends_on:
      - api
    networks: [pspad]

  mongo:
    image: mongo:8
    entrypoint: ["bash", "/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pspad
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
      - ./mongo-keyfile:/keyfile-source/mongo-keyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u pspad -p ${MONGO_PASSWORD} --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks: [pspad]

volumes:
  mongo-data:

networks:
  pspad:
