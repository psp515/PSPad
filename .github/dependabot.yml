version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /src/PSPad.Api
      - /src/PSPad.App
    schedule:
      interval: weekly
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: mongo
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /test/e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
