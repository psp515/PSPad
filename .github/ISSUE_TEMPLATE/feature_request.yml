name: Feature request
description: Suggest a new capability or a change to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you try to do today and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it should work from the user's side.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - GTD core (areas, Inbox, lists, tasks, Today)
        - Statistics
        - Identity
        - Habits
        - Goals and annual plans
        - Integrations (GitHub, OneDrive, Google Drive, Thingiverse)
        - 3D-print domain
        - Reminders
        - Self-hosting / Docker
        - Other
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Must work offline
        - label: Changes what a self-hoster runs (services, environment variables, ports)
        - label: Changes an architecture decision (needs an ADR)
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, links.
