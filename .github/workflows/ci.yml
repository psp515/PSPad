name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet build --no-restore

      - run: dotnet test --filter Category=Unit

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet test --project test/PSPad.Api.Tests --filter Category=Integration

  api-image:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f src/PSPad.Api/Dockerfile -t pspad-api:ci .

      - name: Start Mongo for smoke test
        run: |
          docker network create pspad-ci
          docker run -d --name pspad-mongo-ci --network pspad-ci mongo:8
          for i in $(seq 1 30); do
            if docker exec pspad-mongo-ci mongosh --quiet --eval "db.runCommand('ping').ok" | grep -q 1; then exit 0; fi
            sleep 1
          done
          echo "Mongo never became ready"
          docker logs pspad-mongo-ci
          exit 1

      - name: Smoke test the image
        run: |
          docker run -d --name pspad-api-ci --network pspad-ci -p 5000:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Mongo__ConnectionString="mongodb://pspad-mongo-ci:27017" \
            -e Mongo__Database=pspad \
            pspad-api:ci
          for i in $(seq 1 20); do
            if curl -sf localhost:5000/health; then exit 0; fi
            sleep 1
          done
          echo "API never became healthy"
          docker logs pspad-api-ci
          exit 1

      - if: always()
        run: |
          docker rm -f pspad-api-ci || true
          docker rm -f pspad-mongo-ci || true
          docker network rm pspad-ci || true

  app-image:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f src/PSPad.App/Dockerfile -t pspad-app:ci .

      - name: Serve the app and check what it serves
        run: |
          docker run -d --name pspad-app-ci -p 5001:8080 \
            -e API_BASE_ADDRESS=http://localhost:5000 \
            -e APP_BASE_ADDRESS=http://localhost:5001 \
            -e KEYCLOAK_AUTHORITY=http://localhost:8080/realms/pspad \
            -e KEYCLOAK_CLIENT_ID=pspad-app \
            pspad-app:ci
          for i in $(seq 1 20); do
            if curl -sf localhost:5001/ >/dev/null; then break; fi
            sleep 1
          done
          type=$(curl -s -o /dev/null -w '%{content_type}' localhost:5001/)
          echo "index content-type: $type"
          case "$type" in text/html*) ;; *) echo "the app is not served as HTML"; docker logs pspad-app-ci; exit 1 ;; esac
          curl -sf localhost:5001/appsettings.json | grep -q pspad-app

      - if: always()
        run: docker rm -f pspad-app-ci || true
