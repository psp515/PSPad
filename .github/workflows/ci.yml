name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet build --no-restore

      - run: dotnet test --filter Category=Unit

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet test --project test/PSPad.Api.Tests --filter Category=Integration

  api-image:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f src/PSPad.Api/Dockerfile -t pspad-api:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name pspad-api-ci -p 5000:8080 pspad-api:ci
          for i in $(seq 1 20); do
            if curl -sf localhost:5000/health; then exit 0; fi
            sleep 1
          done
          echo "API never became healthy"
          docker logs pspad-api-ci
          exit 1

      - if: always()
        run: docker rm -f pspad-api-ci || true
