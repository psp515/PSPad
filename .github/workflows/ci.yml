name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet build --no-restore

      - run: dotnet test --filter Category=Unit

  integration-test:
    # mongo:8 refuses the ubuntu-24.04 image's 7.0.0-azure kernel (actions/runner-images#15005); back to ubuntu-latest once MongoDB 8.3.14 ships
    runs-on: ubuntu-22.04
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet test --project test/PSPad.Api.Tests --filter Category=Integration

  api-image:
    # mongo:8 refuses the ubuntu-24.04 image's 7.0.0-azure kernel (actions/runner-images#15005); back to ubuntu-latest once MongoDB 8.3.14 ships
    runs-on: ubuntu-22.04
    needs: build-and-unit-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - run: |
          docker build -f src/PSPad.Api/Dockerfile \
            -t pspad-api:ci \
            -t ghcr.io/psp515/pspad-backend:latest \
            -t ghcr.io/psp515/pspad-backend:${{ github.sha }} \
            .

      - name: Start Mongo for smoke test
        run: |
          docker network create pspad-ci
          docker run -d --name pspad-mongo-ci --network pspad-ci mongo:8
          for i in $(seq 1 30); do
            if docker exec pspad-mongo-ci mongosh --quiet --eval "db.runCommand('ping').ok" | grep -q 1; then exit 0; fi
            sleep 1
          done
          echo "Mongo never became ready"
          docker logs pspad-mongo-ci
          exit 1

      - name: Smoke test the image
        run: |
          docker run -d --name pspad-api-ci --network pspad-ci -p 5000:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Mongo__ConnectionString="mongodb://pspad-mongo-ci:27017" \
            -e Mongo__Database=pspad \
            pspad-api:ci
          for i in $(seq 1 20); do
            if curl -sf localhost:5000/health; then exit 0; fi
            sleep 1
          done
          echo "API never became healthy"
          docker logs pspad-api-ci
          exit 1

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/psp515/pspad-backend:latest
          docker push ghcr.io/psp515/pspad-backend:${{ github.sha }}

      - if: always()
        run: |
          docker rm -f pspad-api-ci || true
          docker rm -f pspad-mongo-ci || true
          docker network rm pspad-ci || true

  app-image:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - run: |
          docker build -f src/PSPad.App/Dockerfile \
            -t pspad-app:ci \
            -t ghcr.io/psp515/pspad-frontend:latest \
            -t ghcr.io/psp515/pspad-frontend:${{ github.sha }} \
            .

      - name: Serve the app and check what it serves
        run: |
          docker run -d --name pspad-app-ci -p 5001:8080 \
            -e API_BASE_ADDRESS=http://localhost:5000 \
            -e APP_BASE_ADDRESS=http://localhost:5001 \
            -e KEYCLOAK_AUTHORITY=http://localhost:8080/realms/psplace \
            -e KEYCLOAK_CLIENT_ID=pspad-frontend \
            pspad-app:ci
          for i in $(seq 1 20); do
            if curl -sf localhost:5001/ >/dev/null; then break; fi
            sleep 1
          done
          type=$(curl -s -o /dev/null -w '%{content_type}' localhost:5001/)
          echo "index content-type: $type"
          case "$type" in text/html*) ;; *) echo "the app is not served as HTML"; docker logs pspad-app-ci; exit 1 ;; esac
          curl -sf localhost:5001/appsettings.json | grep -q pspad-frontend

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/psp515/pspad-frontend:latest
          docker push ghcr.io/psp515/pspad-frontend:${{ github.sha }}

      - if: always()
        run: docker rm -f pspad-app-ci || true

  e2e:
    # mongo:8 refuses the ubuntu-24.04 image's 7.0.0-azure kernel (actions/runner-images#15005); back to ubuntu-latest once MongoDB 8.3.14 ships
    runs-on: ubuntu-22.04
    needs: build-and-unit-test
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      COMPOSE: docker compose -f docker/compose.yaml -f docker/compose.e2e.yaml --env-file docker/.env.example -p pspad-e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Start the stack
        run: $COMPOSE up -d --build --wait

      - run: npm ci
        working-directory: test/e2e

      - run: npx playwright install --with-deps chromium
        working-directory: test/e2e

      - run: npm test -- --shard=${{ matrix.shard }}/2
        working-directory: test/e2e
        env:
          CI: "true"

      - name: Print the stack's logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            test/e2e/playwright-report
            test/e2e/test-results
          retention-days: 7

      - if: always()
        run: $COMPOSE down -v

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [integration-test, e2e, api-image, app-image]
    steps:
      - name: Trigger update on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sudo /opt/pspad/update.sh
