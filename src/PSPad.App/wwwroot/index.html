<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>PSPad</title>
    <script>
        window.pspadBoot = {
            done: function () {
                var splash = document.querySelector('.pspad-boot');
                if (splash) { splash.remove(); }
            }
        };
        // The first screen tears the splash down; a boot that never renders one must not hide the error banner forever.
        setTimeout(window.pspadBoot.done, 20000);
    </script>
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('pspad.theme'); } catch (error) { }
            var dark = stored === 'Dark' ||
                (stored !== 'Light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <script>
        (function () {
            var visible = window.visualViewport;
            if (!visible) { return; }
            var root = document.documentElement.style;
            var track = function () {
                root.setProperty('--pspad-visible-height', visible.height + 'px');
                root.setProperty('--pspad-visible-top', visible.offsetTop + 'px');
            };
            visible.addEventListener('resize', track);
            visible.addEventListener('scroll', track);
            track();
        })();
    </script>
    <style>
        :root { --pspad-boot-bg: #F5F5F5; }
        [data-theme="dark"] { --pspad-boot-bg: #121212; }

        .pspad-boot {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pspad-boot-bg);
            z-index: 9999;
        }

        .pspad-boot-mark { width: 96px; height: 96px; }

        .pspad-boot-check {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: pspad-draw 1.8s ease-in-out infinite;
        }

        @keyframes pspad-draw {
            0%   { stroke-dashoffset: 200; }
            45%  { stroke-dashoffset: 0; }
            75%  { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -200; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pspad-boot-check { animation: none; stroke-dashoffset: 0; }
        }
    </style>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
          media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app"></div>

    <div class="pspad-boot">
        <svg class="pspad-boot-mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"
             role="img" aria-label="Loading PSPad">
            <rect width="512" height="512" rx="112" fill="#4E7A5E" />
            <path d="M160,96 h160 l80,80 v208 a32,32 0 0 1 -32,32 h-208 a32,32 0 0 1 -32,-32 v-256 a32,32 0 0 1 32,-32 z"
                  fill="#FFFFFF" />
            <path d="M320,96 l80,80 h-48 a32,32 0 0 1 -32,-32 z" fill="#CFE0D5" />
            <path class="pspad-boot-check" d="M184,272 l48,48 l96,-120" fill="none" stroke="#4E7A5E"
                  stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
